<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sealed Letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root { --gold:#d9b46a; --ink:#2e1c0c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#070504; color:#eadcc0; font-family:'IM Fell English', Georgia, serif; }
  #scene { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; }

  .title { position:fixed; top:16px; left:20px; pointer-events:none; z-index:5; }
  .title h1 { margin:0; font-family:'Cinzel',serif; font-size:clamp(20px,3vw,30px); letter-spacing:.08em; color:var(--gold);
    text-shadow:0 0 18px rgba(217,180,106,.35); }
  .title p { margin:4px 0 0; font-style:italic; opacity:.65; font-size:15px; }

  #panel { position:fixed; top:16px; right:16px; width:min(340px, calc(100vw - 32px)); z-index:5;
    max-height:calc(100vh - 32px); overflow:auto;
    background:linear-gradient(180deg, rgba(28,20,13,.9), rgba(16,11,8,.9));
    border:1px solid rgba(217,180,106,.35); border-radius:10px; padding:14px 16px;
    box-shadow:0 10px 40px rgba(0,0,0,.6); backdrop-filter:blur(4px); }
  #panel h2 { margin:0 0 4px; font-family:'Cinzel',serif; font-size:13px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase;
    display:flex; justify-content:space-between; align-items:center; }
  #panel.collapsed .body { display:none; }
  .count { font-style:italic; opacity:.7; margin-bottom:8px; }
  #notes { list-style:none; margin:0; padding:0; }
  #notes li { padding:7px 0; border-top:1px dashed rgba(217,180,106,.25); line-height:1.35; font-size:15.5px; animation:pop .7s ease; }
  #notes li.empty { opacity:.55; font-style:italic; border-top:none; }
  @keyframes pop { from { opacity:0; background:rgba(217,180,106,.25);} to { opacity:1; background:transparent; } }
  .tools { display:flex; gap:7px; flex-wrap:wrap; margin:10px 0 4px; }
  button { font-family:'Cinzel',serif; letter-spacing:.06em; font-size:12px; color:#f3e6c8;
    background:rgba(217,180,106,.12); border:1px solid rgba(217,180,106,.45); border-radius:6px; padding:7px 11px; cursor:pointer; }
  button:hover { background:rgba(217,180,106,.25); border-color:var(--gold); }
  button.on { background:rgba(217,180,106,.35); border-color:var(--gold); }
  .door { margin-top:12px; padding-top:12px; border-top:1px solid rgba(217,180,106,.3); }
  .door label { display:block; font-family:'Cinzel',serif; font-size:12.5px; letter-spacing:.12em; color:var(--gold); margin-bottom:7px; }
  .door form { display:flex; gap:8px; }
  .door input { flex:1; min-width:0; font:inherit; font-size:17px; color:#f3e6c8; background:rgba(0,0,0,.35);
    border:1px solid rgba(217,180,106,.4); border-radius:6px; padding:6px 10px; text-transform:uppercase; letter-spacing:.12em; }
  .door input:focus { outline:none; border-color:var(--gold); }
  #msg { min-height:20px; margin-top:7px; font-style:italic; color:#cdb98e; font-size:15px; }
  .shake { animation:shake .4s; }
  @keyframes shake { 20%,60% { transform:translateX(-6px);} 40%,80% { transform:translateX(6px);} }
  .tip { margin-top:10px; font-size:13.5px; opacity:.6; font-style:italic; line-height:1.35; }

  #side { position:fixed; left:16px; top:50%; transform:translateY(-50%); z-index:6; display:flex; flex-direction:column; gap:16px; }
  .sbtn { width:74px; padding:10px 0 8px; display:flex; flex-direction:column; align-items:center; gap:5px;
    border-radius:14px; background:linear-gradient(180deg, rgba(34,24,15,.92), rgba(18,12,8,.92));
    border:1px solid rgba(217,180,106,.4); color:#e9d9b4; font-family:'Cinzel',serif; font-size:10.5px; letter-spacing:.08em;
    box-shadow:0 8px 24px rgba(0,0,0,.55); transition:box-shadow .3s, border-color .3s, background .3s; }
  .sbtn svg { width:38px; height:38px; }
  .sbtn:hover { border-color:var(--gold); }
  .sbtn.on { border-color:var(--gold); background:linear-gradient(180deg, rgba(70,50,22,.95), rgba(36,25,12,.95));
    box-shadow:0 0 0 1px rgba(217,180,106,.4), 0 0 22px rgba(217,180,106,.35), 0 8px 24px rgba(0,0,0,.55); }
  #candleBtn .flame { transition:opacity .3s; }
  #candleBtn.out .flame { opacity:0; }
  #candleBtn .smoke { opacity:0; transition:opacity .3s; }
  #candleBtn.out .smoke { opacity:.7; }
  #candleBtn.out { border-color:#5ff0c4; box-shadow:0 0 0 1px rgba(95,240,196,.35), 0 0 22px rgba(95,240,196,.3), 0 8px 24px rgba(0,0,0,.55); }
  #timer { font-family:'Cinzel',serif; font-size:12.5px; letter-spacing:.1em; color:#cdb98e; margin:2px 0 6px; transition:color .5s; }
  #timer.hot { color:#ff8a4a; text-shadow:0 0 10px rgba(255,120,40,.6); animation:throb 1s infinite; }
  @keyframes throb { 50% { opacity:.55; } }
  #ashCard { position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; padding:20px;
    pointer-events:none; opacity:0; transition:opacity 2s; }
  #ashCard.show { opacity:1; pointer-events:auto; }
  #ashCard .inner { max-width:440px; text-align:center; padding:26px 30px; border-radius:10px;
    background:rgba(12,9,7,.82); border:1px solid rgba(160,150,140,.35); box-shadow:0 20px 60px rgba(0,0,0,.7); }
  #ashCard h3 { margin:0 0 10px; font-family:'Cinzel',serif; color:#c9c0b4; letter-spacing:.1em; font-size:22px; }
  #ashCard p { margin:0 0 14px; font-size:17px; line-height:1.45; color:#bdb3a6; }
  #ashCard button { font-size:11px; opacity:.7; }
  #ring { position:fixed; left:0; top:0; width:0; height:0; pointer-events:none; z-index:4; display:none; }
  #ring.on { display:block; }
  #ring .rim { position:absolute; border-radius:50%; border:10px solid #a07c3c;
    box-shadow:0 0 0 2px #4a3416, 0 0 0 4px #d9b46a, 0 14px 34px rgba(0,0,0,.6), inset 0 0 0 2px #4a3416, inset 0 0 30px rgba(0,0,0,.35); }
  #ring .rim::after { content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.28), rgba(255,255,255,0) 32%); }
  #ring .handle { position:absolute; width:26px; height:118px; transform-origin:13px 0; transform:rotate(-45deg); border-radius:7px 7px 13px 13px;
    background:linear-gradient(90deg, #3a2210, #6b4220 40%, #4a2c14); box-shadow:0 10px 20px rgba(0,0,0,.5); }
  #ring .handle::before { content:''; position:absolute; left:-3px; top:-6px; width:32px; height:22px; border-radius:4px;
    background:linear-gradient(90deg, #6e5126, #d9b46a 45%, #8a6a32); }

  #reveal { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(5,3,2,.7); opacity:0; pointer-events:none; transition:opacity 1.2s; }
  #reveal.show { opacity:1; pointer-events:auto; }
  .card { max-width:500px; color:var(--ink); padding:32px 36px 24px; border-radius:4px;
    background:linear-gradient(135deg, #efe0b8, #d9bf85 60%, #c9a965); box-shadow:0 20px 60px rgba(0,0,0,.7), inset 0 0 60px rgba(110,70,20,.45); }
  .card h3 { font-family:'Cinzel',serif; text-align:center; margin:0 0 14px; font-size:23px; }
  .card p { font-size:18px; line-height:1.5; margin:0 0 12px; }
  .card .row { display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .card button, .card a.btn { color:var(--ink); background:rgba(80,50,15,.12); border:1px solid rgba(80,50,15,.5);
    border-radius:6px; padding:7px 12px; font-family:'Cinzel',serif; font-size:12.5px; letter-spacing:.08em; text-decoration:none; }

  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20;
    font-family:'Cinzel',serif; letter-spacing:.2em; color:#8c7442; background:#070504; transition:opacity .8s; }

  @media (max-width: 760px) {
    #panel { top:auto; bottom:12px; right:50%; transform:translateX(50%); max-height:46vh; }
    .title { top:10px; left:12px; }
    .title p { display:none; }
    #side { top:30%; left:10px; }
    .sbtn { width:64px; }
  }
</style>
</head>
<body>
<div id="loading">Unfolding the letter…</div>
<div id="scene"></div>
<div id="side">
  <button class="sbtn" id="candleBtn" aria-pressed="false" title="Snuff or light the candle">
    <svg viewBox="0 0 40 40"><path class="flame" d="M20 4c3 4 4.5 6.5 4.5 9a4.5 4.5 0 0 1-9 0c0-2.5 1.5-5 4.5-9z" fill="#ffb347"/>
      <path class="flame" d="M20 9c1.4 2 2 3.2 2 4.3a2 2 0 0 1-4 0c0-1.1.6-2.3 2-4.3z" fill="#fff3c4"/>
      <path class="smoke" d="M20 15c-2-2 2-4 0-6s2-4 0-6" stroke="#bfb6a8" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <line x1="20" y1="16" x2="20" y2="19" stroke="#2a1a0c" stroke-width="1.5"/>
      <rect x="14" y="19" width="12" height="15" rx="1.5" fill="#efe3c6"/>
      <ellipse cx="20" cy="35" rx="11" ry="2.6" fill="#b48a46"/></svg>
    <span id="candleLabel">Candle</span>
  </button>
  <button class="sbtn" id="glassBtn" aria-pressed="false" title="Use the magnifying glass">
    <svg viewBox="0 0 40 40"><circle cx="16" cy="16" r="10" fill="rgba(200,230,255,.18)" stroke="#d9b46a" stroke-width="3"/>
      <path d="M11 12a6 6 0 0 1 6-4" stroke="rgba(255,255,255,.6)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <line x1="24" y1="24" x2="34" y2="34" stroke="#6b4220" stroke-width="5" stroke-linecap="round"/></svg>
    <span id="glassLabel">Glass</span>
  </button>
</div>
<div id="ring"><div class="handle"></div><div class="rim"></div></div>

<div class="title"><h1 id="title"></h1><p id="subtitle"></p></div>

<div id="panel">
  <h2><span>Your Notes</span><button id="toggle">Hide</button></h2>
  <div class="body">
    <div id="timer"></div>
    <div class="count" id="count"></div>
    <ul id="notes"><li class="empty">Nothing yet. Look closer…</li></ul>
    <div class="tools">
      <button id="flipBtn">Flip it over</button>
      <button id="resetBtn">Reset view</button>
    </div>
    <div class="door">
      <label for="pw" id="doorLabel"></label>
      <form id="pwForm" autocomplete="off">
        <input id="pw" placeholder="…" spellcheck="false">
        <button type="submit">Speak</button>
      </form>
      <div id="msg"></div>
    </div>
    <div class="tip" id="tip">Drag to turn the letter around. Scroll to move closer. Use the buttons on the left to snuff the candle or pick up the magnifying glass.</div>
  </div>
</div>

<div id="ashCard"><div class="inner"><h3 id="ashHeading"></h3><p id="ashText"></p>
  <button id="unburnBtn" title="For the DM: bring the letter back">Restore the letter (DM)</button></div></div>
<div id="reveal"><div class="card">
  <h3 id="revealHeading"></h3>
  <div id="revealBody"></div>
  <div class="row" id="revealRow"><button id="closeReveal">Back to the letter</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   DM CORNER: edit this block to change the letter.
   - password: the hidden word. Its letters get tiny dots in the letter
     body, in order, so the body text must contain them.
   - "tiny" clues can only be read through the magnifying glass.
   - "glow" clues only show up in the dark (snuff the candle).
   ===================================================================== */
const CONFIG = {
  title: "The Sealed Letter",
  subtitle: "Slipped under your door at the Gilded Stag. Look closely.",
  salutation: "To the bearers of this seal,",
  paragraphs: [
    "You were seen at the Gilded Stag, asking questions that ought not be asked aloud. I admire the courage, though not the volume. The Warden's men read every letter that leaves this city, so I must write plainly and say very little.",
    "My brother vanished three weeks ago, on the night the harbour bells rang without a hand to pull them. The watch says he drowned. The watch is paid to say a great many things.",
    "If you wish to learn more, come to the old chapel by the water after dark. There is a door there that does not open for strangers. I trust you will know what to tell it.",
    "Burn this once read."
  ],
  signature: "V.",
  sealLetter: "V",
  password: "LANTERN",
  dotClue: "Some letters have a tiny ink dot beneath them. Read in order, they spell a word.",

  // Tiny writing, readable only through the glass
  tinyTop:    { text: "look closer — the dotted letters speak", note: "Tiny writing in the top margin: “look closer, the dotted letters speak.”" },
  tinyBottom: { text: "the Warden keeps what he stole in a coffer of four dials", note: "Scrawled along the bottom edge: “The Warden keeps what he stole in a coffer of four dials.”" },
  tinySeal:   { text: "HOUSE ASHGROVE · HOUSE ASHGROVE · ", note: "Pressed into the rim of the wax seal: HOUSE ASHGROVE." },

  // Glowing ink, visible only in the dark
  glowFront: { afterParagraph: 3, text: "Speak the word at the chapel door, and it will know you for a friend.",
               note: "In the dark, glowing ink appears between the lines: “Speak the word at the chapel door.”" },
  glowBack:  { lines: ["The Warden's coffer remembers:", "sun · sea · stone · moon"], runes: ["Sun", "Wave", "Mountain", "Moon"],
               note: "On the back, in the dark: four glowing runes, Sun, Wave, Mountain, Moon, under the words “The Warden's coffer remembers.”" },

  // Ordinary writing on the back of the letter
  backText: ["To the room at the top of the stairs", "The Gilded Stag", "— by hand, and by night —"],

  // The letter burns itself to ash this many minutes after the page opens.
  // Tip for testing: add #quickburn to the end of the page's address to make it burn after 20 seconds.
  burnAfterMinutes: 10,
  showCountdown: true,
  burnedHeading: "Only Ash Remains",
  burnedText: "The letter curls, blackens and crumbles away. Whatever you didn't write down is gone.",

  doorPrompt: "The chapel door asks for a word",
  wrongAnswers: ["Nothing happens. The door stays shut.", "Silence. The stone is unmoved.", "A cold draught, and nothing more."],
  reveal: {
    heading: "The Door Opens",
    body: [
      "The word leaves your lips and the old chapel door groans inward. Candlelight flickers below, where stairs descend beneath the water line.",
      "At the bottom waits a cloaked figure with a lantern. “You read it properly,” says V. “Good. Then you can be trusted with the rest.”"
    ],
    nextLabel: "Open the Warden's Coffer",
    nextUrl: "coffer.html"
  }
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
$('title').textContent = CONFIG.title;
$('subtitle').textContent = CONFIG.subtitle;
$('doorLabel').textContent = CONFIG.doorPrompt;
$('revealHeading').textContent = CONFIG.reveal.heading;
$('revealBody').innerHTML = CONFIG.reveal.body.map(p => `<p>${p}</p>`).join('');
if (CONFIG.reveal.nextUrl) {
  const a = document.createElement('a'); a.className = 'btn'; a.href = CONFIG.reveal.nextUrl; 
  a.textContent = CONFIG.reveal.nextLabel || 'Continue'; $('revealRow').prepend(a);
}
$('toggle').onclick = () => { const p = $('panel'); p.classList.toggle('collapsed'); $('toggle').textContent = p.classList.contains('collapsed') ? 'Show' : 'Hide'; };
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) { document.body.classList.add('touch'); $('tip').textContent = 'Drag to turn the letter. Tap the glass button on the left, then drag your finger to look closely. The candle button puts out the light.'; }

// ---------- clue bookkeeping ----------
const clueNotes = {
  dots: CONFIG.dotClue, top: CONFIG.tinyTop.note, bottom: CONFIG.tinyBottom.note, seal: CONFIG.tinySeal.note,
  glowFront: CONFIG.glowFront.note, glowBack: CONFIG.glowBack.note
};
const total = Object.keys(clueNotes).length, found = new Set();
const renderCount = () => $('count').textContent = `Clues found: ${found.size} of ${total}`;
renderCount();
function discover(key) {
  if (found.has(key) || !(key in clueNotes)) return;
  found.add(key);
  const ul = $('notes'); const e = ul.querySelector('.empty'); if (e) e.remove();
  const li = document.createElement('li'); li.textContent = clueNotes[key]; ul.appendChild(li);
  renderCount();
}

const pw = CONFIG.password.toUpperCase().replace(/[^A-Z]/g, '');
let wrongN = 0;
let onSolved = () => {};
$('pwForm').addEventListener('submit', e => {
  e.preventDefault();
  const g = $('pw').value.toUpperCase().replace(/[^A-Z]/g, '');
  if (!g) return;
  if (g === pw) { $('msg').textContent = 'The seal grows warm in your hand…'; onSolved(); setTimeout(() => $('reveal').classList.add('show'), 1600); }
  else { $('msg').textContent = CONFIG.wrongAnswers[wrongN++ % CONFIG.wrongAnswers.length];
         const f = $('pwForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
});
$('closeReveal').onclick = () => $('reveal').classList.remove('show');

if (!window.THREE) { $('loading').textContent = 'The letter could not be loaded (3D library blocked).'; }
else start().catch(err => { console.error(err); $('loading').textContent = 'Something went wrong unfolding the letter.'; });

// =====================================================================
async function start() {
  // ---------- wait for fonts and the paper image ----------
  const timeout = ms => new Promise(r => setTimeout(r, ms));
  if (document.fonts) await Promise.race([Promise.all([
    document.fonts.load('60px "IM Fell English"'), document.fonts.load('italic 60px "IM Fell English"'),
    document.fonts.load('140px "Pinyon Script"'), document.fonts.load('700 40px Cinzel')]).catch(()=>{}), timeout(3500)]);
  let paperImg = null;
  try {
    const res = await fetch('paper.jpg');
    if (res.ok) paperImg = await createImageBitmap(await res.blob());
  } catch (e) { console.warn('paper texture not loaded, using fallback', e); }

  const CW = 2048, CH = 2730;          // texture size (3:4 like the sheet)
  const PW = 3, PH = 4;                // sheet size in world units
  const newCanvas = () => { const c = document.createElement('canvas'); c.width = CW; c.height = CH; return c; };

  // ---------- seeded randomness so the tears are the same every visit ----------
  let seed = 1337;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---------- the torn outline ----------
  const tornPts = [], burnFlags = [];
  (() => {
    const per = 2 * (CW + CH), step = 9;
    const tears = [ { s: CW * 0.62, depth: 150, hw: 60 },                 // top edge notch
                    { s: CW + CH * 0.55, depth: 165, hw: 55 },            // rip in the right edge
                    { s: CW + CH + CW * 0.7, depth: 115, hw: 70 } ];      // bottom edge (x = 0.3 * CW)
    const burnFrom = CW + CH - 520, burnTo = CW + CH + 560;               // around the bottom-right corner
    let walk = 0;
    for (let s = 0; s < per; s += step) {
      let x, y, nx, ny;
      if (s < CW) { x = s; y = 0; nx = 0; ny = 1; }
      else if (s < CW + CH) { x = CW; y = s - CW; nx = -1; ny = 0; }
      else if (s < 2 * CW + CH) { x = CW - (s - CW - CH); y = CH; nx = 0; ny = -1; }
      else { x = 0; y = CH - (s - 2 * CW - CH); nx = 1; ny = 0; }
      walk += (rnd() - 0.5) * 9; walk *= 0.93;
      let d = 30 + walk * 2.2 + rnd() * 9;
      for (const t of tears) { const k = 1 - Math.abs(s - t.s) / t.hw; if (k > 0) d += t.depth * k * (0.75 + rnd() * 0.4); }
      // missing top-left corner, torn off diagonally
      const dc = Math.min(s, per - s); if (dc < 340) d += (340 - dc) * 0.85 + rnd() * 14;
      const burn = s > burnFrom && s < burnTo;
      if (burn) { const k = Math.sin(Math.PI * (s - burnFrom) / (burnTo - burnFrom)); d += k * (55 + Math.sin(s * 0.02) * 30 + rnd() * 10); }
      // pull corners in so the outline stays inside the canvas
      tornPts.push([x + nx * d, y + ny * d]);
      burnFlags.push(burn);
    }
    // corners: push them inward on both axes
    for (const p of tornPts) { p[0] = Math.min(CW - 22, Math.max(22, p[0])); p[1] = Math.min(CH - 22, Math.max(22, p[1])); }
  })();
  const holes = [ { x: 110, y: CH * 0.56, r: 36 }, { x: CW - 120, y: CH * 0.24, r: 30 }, { x: CW * 0.52, y: CH - 150, r: 22 } ]
    .map(h => { const pts = []; for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, rr = h.r * (0.65 + rnd() * 0.6); pts.push([h.x + Math.cos(a) * rr, h.y + Math.sin(a) * rr]); } return pts; });
  const pathOf = (ctx, pts) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); };

  function finish(canvas, aged) {
    const g = canvas.getContext('2d');
    if (aged) {
      g.save(); g.globalCompositeOperation = 'source-atop';
      // darkened, frayed edges
      for (let i = 0; i < 20; i++) { pathOf(g, tornPts); g.lineWidth = 130 - i * 6; g.strokeStyle = `rgba(80,45,15,${0.025 + i * 0.004})`; g.stroke(); }
      // scorched section around the bottom-right corner
      for (let pass = 0; pass < 18; pass++) {
        g.lineWidth = 160 - pass * 8.5; g.strokeStyle = `rgba(28,12,3,${0.05 + pass * 0.012})`;
        g.beginPath(); let on = false;
        tornPts.forEach((p, i) => { if (burnFlags[i]) { on ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); on = true; } else on = false; });
        g.stroke();
      }
      for (const h of holes) for (let i = 0; i < 10; i++) { pathOf(g, h); g.lineWidth = 50 - i * 4.5; g.strokeStyle = `rgba(35,15,4,${0.06 + i * 0.03})`; g.stroke(); }
      g.restore();
    }
    g.save();
    g.globalCompositeOperation = 'destination-in'; pathOf(g, tornPts); g.fillStyle = '#000'; g.fill();
    g.globalCompositeOperation = 'destination-out'; for (const h of holes) { pathOf(g, h); g.fill(); }
    g.restore();
  }

  function paper(g) {
    if (paperImg) g.drawImage(paperImg, 0, 0, CW, CH);
    else { g.fillStyle = '#e2cd9f'; g.fillRect(0, 0, CW, CH); }
  }

  // ---------- rune drawings (shared with the coffer) ----------

  function frontPoint(burnLevel, out) {
    const b0 = Math.max(0, Math.min(BUCKETS - 1, Math.floor(burnLevel * BUCKETS) + Math.floor(rnd() * 3) - 1));
    let list = buckets[b0]; if (!list.length) return false;
    const i = list[Math.floor(Math.random() * list.length)], px = i % BW, py = Math.floor(i / BW);
    const x = ((px + 0.5) / BW - 0.5) * PW, y = (0.5 - (py + 0.5) / BH) * PH;
    out.set(x, y, dispZ(x, y)).applyMatrix4(letter.matrixWorld); return true;
  }
  function makePoints(n, size, blending, opacity) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    const mat = new THREE.PointsMaterial({ size, vertexColors: true, transparent: true, opacity, blending, depthWrite: false, sizeAttenuation: true });
    const pts = new THREE.Points(geo, mat); pts.frustumCulled = false; scene.add(pts);
    for (let i = 0; i < n; i++) geo.attributes.position.array[i * 3 + 1] = -999;
    return { pts, geo, n, vel: new Float32Array(n * 3), life: new Float32Array(n), max: new Float32Array(n), shade: new Float32Array(n), next: 0 };
  }
  const embers = makePoints(500, 0.055, THREE.AdditiveBlending, 1);
  const ash = makePoints(2200, 0.045, THREE.NormalBlending, 0.95);
  const smoke = makePoints(160, 0.9, THREE.NormalBlending, 0.16);
  { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c);
    embers.pts.material.map = t; smoke.pts.material.map = t; }
  { const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'); g.fillStyle = '#fff';
    g.beginPath(); g.moveTo(4, 10); g.lineTo(20, 3); g.lineTo(29, 17); g.lineTo(16, 29); g.lineTo(6, 22); g.closePath(); g.fill();
    ash.pts.material.map = new THREE.CanvasTexture(c); ash.pts.material.alphaTest = 0.3; }
  function spawn(sys, p, vx, vy, vz, life, shade) {
    const i = sys.next; sys.next = (sys.next + 1) % sys.n;
    const P = sys.geo.attributes.position.array; P[i * 3] = p.x; P[i * 3 + 1] = p.y; P[i * 3 + 2] = p.z;
    sys.vel[i * 3] = vx; sys.vel[i * 3 + 1] = vy; sys.vel[i * 3 + 2] = vz; sys.life[i] = life; sys.max[i] = life; sys.shade[i] = shade;
  }
  function clearSys(sys) { sys.life.fill(0); const P = sys.geo.attributes.position.array; for (let i = 0; i < sys.n; i++) P[i * 3 + 1] = -999; sys.geo.attributes.color.array.fill(0);
    sys.geo.attributes.position.needsUpdate = sys.geo.attributes.color.needsUpdate = true; }
  const fireLight = new THREE.PointLight(0xff7a2a, 0, 12, 1.5); scene.add(fireLight);
  const fireAvg = new THREE.Vector3();

  const BURN_SECONDS = 16;
  const burnDelay = (location.hash === '#quickburn' ? 20 : CONFIG.burnAfterMinutes * 60) * 1000;
  let burnStartAt = performance.now() + burnDelay, burnT = -1, burnedOut = false, sealFall = null;
  $('ashHeading').textContent = CONFIG.burnedHeading; $('ashText').textContent = CONFIG.burnedText;
  $('unburnBtn').onclick = () => {
    burnT = -1; burnedOut = false; burnU.uBurn.value = 0; letter.visible = true; front.castShadow = true;
    letter.attach(seal); seal.position.copy(sealHome.pos); seal.quaternion.copy(sealHome.quat); sealFall = null;
    clearSys(embers); clearSys(ash); clearSys(smoke); fireLight.intensity = 0;
    $('ashCard').classList.remove('show'); burnStartAt = performance.now() + burnDelay;
  };

  // ---------- magnifier (render-to-texture) ----------
  const LENS = isTouch ? 190 : 230, ZOOM = 3.4;
  const rt = new THREE.WebGLRenderTarget(LENS * DPR, LENS * DPR);
  const overlay = new THREE.Scene();
  const ortho = new THREE.OrthographicCamera(0, innerWidth, 0, -innerHeight, -1, 1);
  const lensMesh = new THREE.Mesh(new THREE.CircleGeometry(LENS / 2, 64), new THREE.MeshBasicMaterial({ map: rt.texture, toneMapped: false }));
  overlay.add(lensMesh);
  const ring = $('ring'), rim = ring.querySelector('.rim'), handle = ring.querySelector('.handle');
  const RIM = LENS + 20;
  Object.assign(rim.style, { width: RIM + 'px', height: RIM + 'px', left: -RIM / 2 + 'px', top: -RIM / 2 + 'px' });
  const hOff = RIM / 2 * 0.707; Object.assign(handle.style, { left: hOff - 13 + 'px', top: hOff + 'px' });

  // ---------- view & controls ----------
  const view = { yaw: 0, pitch: 0, dist: 8.6 }, viewT = { ...view };
  let lens = { on: false, x: 0, y: 0 }, drag = null, glassOn = false;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const pickables = [front, back, sealCap, sealBody];
  function hitAt(x, y) {
    ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    return ray.intersectObjects(pickables, false)[0] || null;
  }
  const inRect = (r, px, py) => r && px >= r[0] && px <= r[2] && py >= r[1] && py <= r[3];
  function checkLensClues(h) {
    if (!h) return;
    if (h.object === sealCap || h.object === sealBody) { discover('seal'); return; }
    if (h.object !== front || !h.uv) return;
    const px = h.uv.x * CW, py = (1 - h.uv.y) * CH;
    if (inRect(rects.top, px, py)) discover('top');
    if (inRect(rects.bottom, px, py)) discover('bottom');
    if (rects.dots.some(r => inRect(r, px, py))) discover('dots');
  }
  function placeLens(x, y) {
    if (burnT >= 0) { hideLens(); return; }
    const h = hitAt(x, y);
    lens.on = !!h; lens.x = x; lens.y = y;
    ring.classList.toggle('on', lens.on);
    if (lens.on) { ring.style.transform = `translate(${x}px, ${y}px)`; checkLensClues(h); }
  }
  const hideLens = () => { lens.on = false; ring.classList.remove('on'); };

  const el = renderer.domElement;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId);
    const touchGlass = e.pointerType === 'touch' && glassOn;
    drag = { x: e.clientX, y: e.clientY, glass: touchGlass };
    if (touchGlass) placeLens(e.clientX, e.clientY - 120); else { hideLens(); el.style.cursor = 'grabbing'; }
  });
  el.addEventListener('pointermove', e => {
    if (drag && !drag.glass) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
      viewT.yaw += dx * 0.008; viewT.pitch = Math.max(-0.9, Math.min(0.9, viewT.pitch + dy * 0.006));
    } else if (drag && drag.glass) placeLens(e.clientX, e.clientY - 120);
    else if (e.pointerType !== 'touch') { if (glassOn) placeLens(e.clientX, e.clientY); else hideLens(); el.style.cursor = lens.on ? 'none' : 'grab'; }
  });
  const endDrag = e => { if (drag && drag.glass) hideLens(); drag = null; el.style.cursor = 'grab';
    if (e && e.pointerType !== 'touch' && glassOn) placeLens(e.clientX, e.clientY); };
  el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
  el.addEventListener('pointerleave', () => { if (!drag) hideLens(); });
  el.addEventListener('wheel', e => { e.preventDefault(); viewT.dist = Math.max(4.5, Math.min(14, viewT.dist + e.deltaY * 0.006)); }, { passive: false });

  $('flipBtn').onclick = () => { viewT.yaw = Math.round(viewT.yaw / Math.PI) * Math.PI + Math.PI; };
  $('resetBtn').onclick = () => { viewT.yaw = Math.round(viewT.yaw / (2 * Math.PI)) * 2 * Math.PI; viewT.pitch = 0; viewT.dist = baseDist(); };
  let dark = false, darkK = 0;
  $('candleBtn').onclick = () => { dark = !dark; const b = $('candleBtn'); b.classList.toggle('out', dark); b.setAttribute('aria-pressed', dark);
    $('candleLabel').textContent = dark ? 'Relight' : 'Candle'; };
  $('glassBtn').onclick = () => { glassOn = !glassOn; const b = $('glassBtn'); b.classList.toggle('on', glassOn); b.setAttribute('aria-pressed', glassOn);
    $('glassLabel').textContent = glassOn ? 'Put down' : 'Glass'; if (!glassOn) hideLens(); };

  let sealGlow = 0;
  onSolved = () => { sealGlow = 0.001; };

  function baseDist() {
    const a = innerWidth / innerHeight, vfov = 38 * Math.PI / 180;
    const needH = 5.0 / (2 * Math.tan(vfov / 2)), needW = 3.9 / (2 * Math.tan(vfov / 2) * a);
    return Math.max(needH, needW);
  }
  view.dist = viewT.dist = baseDist();
  function onResize() {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    ortho.right = innerWidth; ortho.bottom = -innerHeight; ortho.updateProjectionMatrix();
    viewT.dist = baseDist();
  }
  addEventListener('resize', onResize);

  // ---------- loop ----------
  const clock = new THREE.Clock();
  const facing = new THREE.Vector3(), toCam = new THREE.Vector3();
  const glowTimer = { glowFront: 0, glowBack: 0 };
  $('loading').style.opacity = 0; setTimeout(() => $('loading').remove(), 900);

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    const k = 1 - Math.pow(0.002, dt);
    view.yaw += (viewT.yaw - view.yaw) * k; view.pitch += (viewT.pitch - view.pitch) * k; view.dist += (viewT.dist - view.dist) * k;

    // letter hangs in the candlelight, gently drifting
    const wide = innerWidth > 900 && innerWidth / innerHeight > 1.2;
    letter.position.set(wide ? -0.9 : 0, 0.05 + Math.sin(t * 0.8) * 0.04, 0);
    letter.rotation.y = view.yaw + Math.sin(t * 0.5) * 0.03;
    letter.rotation.x = view.pitch + Math.sin(t * 0.7 + 1) * 0.02;
    camera.position.set(letter.position.x, 0.35, view.dist);
    camera.lookAt(letter.position.x, -0.05, 0);

    // light / dark
    darkK += ((dark ? 1 : 0) - darkK) * (1 - Math.pow(0.02, dt));
    const flick = 0.86 + 0.09 * Math.sin(t * 9) + 0.06 * Math.sin(t * 23.7) + 0.04 * Math.sin(t * 41);
    candleLight.intensity = 2.4 * flick * (1 - darkK);
    flame.material.opacity = 1 - darkK; flame.scale.set(0.22 + 0.03 * flick, 0.4 + 0.08 * flick, 1);
    candle.material.emissiveIntensity = 1 - darkK;
    hemi.intensity = 0.4 * (1 - darkK) + 0.015;
    fill.intensity = 0.45 * (1 - darkK);
    moon.intensity = 0.18 * (1 - darkK) + 0.06 * darkK;
    const glow = Math.pow(darkK, 1.5) * (1.25 + 0.08 * Math.sin(t * 2.2));
    frontMat.emissiveIntensity = glow; backMat.emissiveIntensity = glow;
    bgColor.setRGB(0.051 * (1 - darkK) + 0.008, 0.035 * (1 - darkK) + 0.008, 0.024 * (1 - darkK) + 0.012);
    scene.fog.color.copy(bgColor);

    // which side faces the camera? glowing ink is noticed after a moment in the dark
    facing.set(0, 0, 1).applyQuaternion(letter.quaternion);
    toCam.copy(camera.position).sub(letter.position).normalize();
    const side = facing.dot(toCam) > 0.25 ? 'glowFront' : facing.dot(toCam) < -0.25 ? 'glowBack' : null;
    for (const key in glowTimer) glowTimer[key] = (darkK > 0.85 && side === key) ? glowTimer[key] + dt : 0;
    if (glowTimer.glowFront > 0.8) discover('glowFront');
    if (glowTimer.glowBack > 0.8) discover('glowBack');

    if (sealGlow > 0) { sealGlow = Math.min(1, sealGlow + dt * 0.7);
      const c = 0.5 + 0.5 * Math.sin(t * 4); sealCapMat.emissive.setRGB(0.9 * sealGlow * c, 0.45 * sealGlow * c, 0.1 * sealGlow * c); sealMatBody.emissive.copy(sealCapMat.emissive); }

    // ---------- countdown & burning ----------
    const now = performance.now();
    if (burnT < 0) {
      const left = Math.max(0, burnStartAt - now) / 1000;
      if (CONFIG.showCountdown) { const m = Math.floor(left / 60), sec = Math.floor(left % 60);
        $('timer').textContent = left > 0 ? `The letter will burn in ${m}:${String(sec).padStart(2, '0')}` : 'It catches fire!';
        $('timer').classList.toggle('hot', left < 60); }
      if (left <= 0) { burnT = 0; hideLens(); }
    }
    if (burnT >= 0 && !burnedOut) {
      burnT += dt;
      const b = Math.min(1.06, Math.pow(burnT / BURN_SECONDS, 0.85) * 1.06);
      burnU.uBurn.value = Math.max(0.0002, b);
      $('timer').textContent = 'It\u2019s burning!';
      if (b > 0.35) front.castShadow = false;
      // embers, ash and smoke from the burning edge
      letter.updateMatrixWorld();
      fireAvg.set(0, 0, 0); let cnt = 0;
      const rate = b < 1 ? 1 : 0;
      for (let i = 0; i < 9 * rate; i++) if (frontPoint(b, tmpV)) {
        fireAvg.add(tmpV); cnt++;
        spawn(embers, tmpV, (Math.random() - 0.5) * 0.3, 0.6 + Math.random() * 0.9, (Math.random() - 0.5) * 0.3, 0.7 + Math.random() * 1.2, 1);
      }
      for (let i = 0; i < 12 * rate; i++) if (frontPoint(b - 0.015, tmpV))
        spawn(ash, tmpV, (Math.random() - 0.5) * 0.25, -0.15 - Math.random() * 0.3, (Math.random() - 0.5) * 0.25, 999, 0.12 + Math.random() * 0.3);
      if (Math.random() < 0.6 * rate && frontPoint(b, tmpV)) spawn(smoke, tmpV, (Math.random() - 0.5) * 0.15, 0.5 + Math.random() * 0.3, 0, 3.5, 0.25);
      if (cnt) fireLight.position.copy(fireAvg.divideScalar(cnt)).add(new THREE.Vector3(0, 0, 0.4));
      fireLight.intensity = (b < 1 ? 2.6 : Math.max(0, 2.6 - (burnT - BURN_SECONDS) * 3)) * (0.8 + 0.2 * Math.sin(t * 17) + 0.1 * Math.sin(t * 31));
      // the wax seal falls off when the flames reach it
      if (!sealFall && b > sealBn + 0.02) { scene.attach(seal); sealFall = { v: 0, spin: (Math.random() - 0.5) * 6 }; }
      if (b >= 1.06 && !burnedOut) { burnedOut = true; letter.visible = false; fireLight.intensity = 0;
        $('timer').textContent = 'Only ash remains.'; $('timer').classList.remove('hot');
        setTimeout(() => $('ashCard').classList.add('show'), 2200); }
    }
    if (sealFall) {
      sealFall.v -= 9.8 * dt; seal.position.y += sealFall.v * dt;
      const floorY = DESK_Y + 0.03;
      if (seal.position.y <= floorY) { seal.position.y = floorY; sealFall.v = Math.abs(sealFall.v) > 1.2 ? -sealFall.v * 0.25 : 0;
        seal.quaternion.slerp(new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, seal.rotation.z)), 0.3); }
      else seal.rotation.x += sealFall.spin * dt;
    }
    // particle updates
    for (const sys of [embers, ash, smoke]) {
      const P = sys.geo.attributes.position.array, C = sys.geo.attributes.color.array; let any = false;
      for (let i = 0; i < sys.n; i++) {
        if (sys.life[i] <= 0) continue; any = true;
        const j = i * 3;
        if (sys === ash) {
          if (P[j + 1] > DESK_Y + 0.02) { sys.vel[j] += Math.sin(t * 2 + i) * 0.4 * dt; sys.vel[j + 2] += Math.cos(t * 1.7 + i) * 0.4 * dt;
            sys.vel[j] *= 0.98; sys.vel[j + 2] *= 0.98; sys.vel[j + 1] = Math.max(-0.7, sys.vel[j + 1] - 0.25 * dt);
            P[j] += sys.vel[j] * dt; P[j + 1] += sys.vel[j + 1] * dt; P[j + 2] += sys.vel[j + 2] * dt; }
          else P[j + 1] = DESK_Y + 0.015;
          const s = sys.shade[i]; C[j] = s; C[j + 1] = s * 0.97; C[j + 2] = s * 0.93;
        } else {
          sys.life[i] -= dt; const f = Math.max(0, sys.life[i] / sys.max[i]);
          sys.vel[j] += (Math.random() - 0.5) * 1.2 * dt; sys.vel[j + 2] += (Math.random() - 0.5) * 1.2 * dt;
          P[j] += sys.vel[j] * dt; P[j + 1] += sys.vel[j + 1] * dt; P[j + 2] += sys.vel[j + 2] * dt;
          if (sys === embers) { C[j] = f; C[j + 1] = 0.45 * f * f; C[j + 2] = 0.08 * f; }
          else { const g = 0.35 * f; C[j] = g; C[j + 1] = g; C[j + 2] = g; }
          if (sys.life[i] <= 0) { C[j] = C[j + 1] = C[j + 2] = 0; P[j + 1] = -999; }
        }
      }
      if (any) { sys.geo.attributes.position.needsUpdate = true; sys.geo.attributes.color.needsUpdate = true; }
    }

    // magnified view
    if (lens.on) {
      const W = innerWidth, H = innerHeight, s = LENS / ZOOM;
      camera.setViewOffset(W, H, lens.x - s / 2, lens.y - s / 2, s, s);
      renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null);
      camera.clearViewOffset();
    }
    renderer.render(scene, camera);
    if (lens.on) {
      lensMesh.position.set(lens.x, -lens.y, 0);
      renderer.autoClear = false; renderer.clearDepth(); renderer.render(overlay, ortho); renderer.autoClear = true;
    }
    requestAnimationFrame(frame);
  }
  frame();
}
</script>
</body>
</html>
